<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="dashboard">
    <header>
        <h1>Daily Expense Tracker</h1>
        <p>Manage your everyday spending</p>
    </header>
    <nav>
        <a href="index.html" class="active">Dashboard</a>
        <a href="add-expense.html">Add Expense</a>
        <a href="history.html">Expense History</a>
        <a href="reports.html">Reports</a>
    </nav>
    <main>
        <h2>Dashboard</h2>
        <p class="intro">Here is an overview of your expenses.</p>
        <section class="summary">
            <div class="box">
                <p>Total Spent</p>
                <h3 id="total">₹0.00</h3>
            </div>
            <div class="box">
                <p>Total Transactions</p>
                <h3 id="count">0</h3>
            </div>
            <div class="box">
                <p>Highest Expense</p>
                <h3 id="highest">₹0.00</h3>
            </div>
        </section>
        <section class="panel">
            <h2>Recent Expenses</h2>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Expense Name</th>
                            <th>Category</th>
                            <th>Date</th>
                            <th>Amount</th>
                        </tr>
                    </thead>
                    <tbody id="recentList"></tbody>
                </table>
            </div>
            <p>
                <a href="history.html" class="text-link">
                    View all expenses
                </a>
            </p>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
