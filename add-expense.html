<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Expense</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="add">
    <header>
        <h1>Daily Expense Tracker</h1>
        <p>Manage your everyday spending</p>
    </header>
    <nav>
        <a href="index.html">Dashboard</a>
        <a href="add-expense.html" class="active">Add Expense</a>
        <a href="history.html">Expense History</a>
        <a href="reports.html">Reports</a>
    </nav>
    <main>
        <h2>Add a New Expense</h2>
        <p class="intro">Enter the details of your transaction below.</p>
        <section class="panel">
            <form id="expenseForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="name">Expense Name</label>
                        <input type="text" id="name"
                               placeholder="e.g. Lunch" required>
                    </div>
                    <div class="form-group">
                        <label for="amount">Amount (₹)</label>
                        <input type="number" id="amount"
                               placeholder="e.g. 150"
                               min="0.01" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category">
                            <option>Food</option>
                            <option>Travel</option>
                            <option>Shopping</option>
                            <option>Education</option>
                            <option>Bills</option>
                            <option>Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="date">Date</label>
                        <input type="date" id="date" required>
                    </div>
                    <div class="form-group">
                        <label for="payment">Payment Method</label>
                        <select id="payment">
                            <option>UPI</option>
                            <option>Cash</option>
                            <option>Card</option>
                            <option>Net Banking</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="description">Description (Optional)</label>
                        <input type="text" id="description"
                               placeholder="Add a short note">
                    </div>
                </div>
                <button type="submit">Add Expense</button>
                <button type="reset" class="secondary-btn">Clear Form</button>
                <p id="message" class="message"></p>
            </form>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
